<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wings</title>
<style>
  :root {
    --bg: #0e0f13;
    --surface: #181920;
    --border: #2a2c38;
    --accent: #6c7bff;
    --accent-dim: #3d4699;
    --text: #e8e9f0;
    --muted: #7b7e96;
    --error: #ff5f72;
    --success: #4ecb82;
    --radius: 10px;
    --font: 'Inter', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  /* Layout */
  .screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; }
  .screen.active { display: flex; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 400px;
  }

  /* Logo / wordmark */
  .logo {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .logo span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 8px; padding: 4px; margin-bottom: 24px; }
  .tab {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all .15s;
  }
  .tab.active { background: var(--surface); color: var(--text); }

  /* Form */
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.2px; }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="email"], input[type="password"], textarea, select {
    width: 100%; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 14px; font-family: var(--font);
    outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }

  /* Button */
  .btn {
    width: 100%; padding: 11px;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
    margin-top: 4px;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); margin-top: 10px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); opacity: 1; }
  .btn-danger { background: #2e1a1e; color: var(--error); border: 1px solid #3d1e23; margin-top: 10px; }
  .btn-danger:hover { background: #3d1e23; opacity: 1; }

  /* Messages */
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: #2e1a1e; color: var(--error); border: 1px solid #3d1e23; }
  .msg.success { background: #122b1f; color: var(--success); border: 1px solid #1a4030; }
  .msg.info { background: #151b3a; color: #8fa3ff; border: 1px solid #2a3670; }

  /* Profile screen */
  #screen-profile { flex-direction: column; align-items: stretch; padding: 0; justify-content: flex-start; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
    top: env(safe-area-inset-top, 0px);
  }
  .topbar-logo { font-size: 17px; font-weight: 600; }
  .topbar-logo span { color: var(--accent); }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-dim); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .signout-btn {
    padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 7px; background: transparent; color: var(--muted);
    font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .signout-btn:hover { color: var(--text); border-color: var(--muted); }

  .profile-body { max-width: 520px; margin: 0 auto; width: 100%; padding: 28px 20px 60px; }
  .section-head { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.6px; margin-bottom: 14px; margin-top: 28px; text-transform: uppercase; }
  .section-head:first-child { margin-top: 0; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .info-grid { grid-template-columns: 1fr; } }

  .save-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .save-bar .btn { margin: 0; max-width: 140px; }
  .save-status { font-size: 12px; color: var(--muted); flex: 1; }
  .save-status.saved { color: var(--success); }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .center-text { text-align: center; color: var(--muted); font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="screen-auth" class="screen active">
  <div class="card">
    <div class="logo">Wings<span>.</span></div>
    <p class="subtitle">Your synced profile — anywhere</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('register')">Create account</button>
      <button class="tab" onclick="switchTab('login')">Sign in</button>
    </div>

    <div id="msg-auth" class="msg"></div>

    <!-- Register form -->
    <div id="form-register">
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" autocomplete="new-password">
      </div>
      <button class="btn" id="reg-btn" onclick="register()">Create account</button>
    </div>

    <!-- Login form -->
    <div id="form-login" style="display:none">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="btn" id="login-btn" onclick="login()">Sign in</button>
    </div>

    <p class="center-text" id="switch-text">
      Already have an account? <button class="link-btn" onclick="switchTab('login')">Sign in</button>
    </p>
  </div>
</div>

<!-- Profile Screen -->
<div id="screen-profile" class="screen">
  <div class="topbar">
    <div class="topbar-logo">Wings<span>.</span></div>
    <div class="topbar-actions">
      <div class="avatar" id="top-avatar">?</div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="profile-body">
    <div id="msg-profile" class="msg"></div>

    <div class="section-head">Identity</div>
    <div class="info-grid">
      <div class="field">
        <label>Display name</label>
        <input type="text" id="p-name" placeholder="Your name" oninput="markDirty()">
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="p-username" placeholder="@handle" oninput="markDirty()">
      </div>
    </div>

    <div class="section-head">About</div>
    <div class="field">
      <label>Bio</label>
      <textarea id="p-bio" placeholder="A short description about yourself…" oninput="markDirty()"></textarea>
    </div>
    <div class="info-grid">
      <div class="field">
        <label>Location</label>
        <input type="text" id="p-location" placeholder="City, Country" oninput="markDirty()">
      </div>
      <div class="field">
        <label>Website</label>
        <input type="text" id="p-website" placeholder="https://…" oninput="markDirty()">
      </div>
    </div>

    <div class="section-head">Preferences</div>
    <div class="info-grid">
      <div class="field">
        <label>Timezone</label>
        <input type="text" id="p-timezone" placeholder="e.g. UTC+5:30" oninput="markDirty()">
      </div>
      <div class="field">
        <label>Language</label>
        <input type="text" id="p-language" placeholder="e.g. English" oninput="markDirty()">
      </div>
    </div>

    <div class="section-head">Notes (private)</div>
    <div class="field">
      <textarea id="p-notes" placeholder="Anything you want to remember across devices…" oninput="markDirty()"></textarea>
    </div>

    <!-- spacer for save bar -->
    <div style="height:60px"></div>
  </div>

  <div class="save-bar">
    <button class="btn" id="save-btn" onclick="saveProfile()">Save changes</button>
    <span class="save-status" id="save-status">All changes saved</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut as fbSignOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-0R_fOTkrU59ACvPpBY-6RBDOhiTTpm8",
  authDomain: "wings-6c6aa.firebaseapp.com",
  projectId: "wings-6c6aa",
  storageBucket: "wings-6c6aa.firebasestorage.app",
  messagingSenderId: "960472992388",
  appId: "1:960472992388:web:3979fadda252d3f446d0d1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let dirty = false;

// ── Auth state ──────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    showScreen('profile');
    const initials = user.email.substring(0, 2).toUpperCase();
    document.getElementById('top-avatar').textContent = initials;
    await loadProfile(user.uid);
  } else {
    showScreen('auth');
  }
});

// ── Helpers ─────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function showMsg(elId, text, type = 'error') {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = 'msg show ' + type;
  if (type === 'success' || type === 'info') {
    setTimeout(() => el.classList.remove('show'), 3000);
  }
}

function setLoading(btnId, loading, text = '') {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
}

// ── Auth ────────────────────────────────────────────────────
window.switchTab = (tab) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('switch-text').innerHTML = tab === 'register'
    ? `Already have an account? <button class="link-btn" onclick="switchTab('login')">Sign in</button>`
    : `New here? <button class="link-btn" onclick="switchTab('register')">Create account</button>`;
  document.querySelectorAll('.tab')[tab === 'register' ? 0 : 1].classList.add('active');
  document.getElementById('msg-auth').classList.remove('show');
};

window.register = async () => {
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-password').value;
  if (!email || !pass) return showMsg('msg-auth', 'Fill in all fields.');
  setLoading('reg-btn', true, 'Creating…');
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    // profile doc gets created on first save or load
  } catch (e) {
    showMsg('msg-auth', friendlyError(e.code));
    setLoading('reg-btn', false, 'Create account');
  }
};

window.login = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) return showMsg('msg-auth', 'Fill in all fields.');
  setLoading('login-btn', true, 'Signing in…');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    showMsg('msg-auth', friendlyError(e.code));
    setLoading('login-btn', false, 'Sign in');
  }
};

window.signOut = async () => {
  await fbSignOut(auth);
};

// ── Profile ─────────────────────────────────────────────────
async function loadProfile(uid) {
  const ref  = doc(db, 'users', uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const d = snap.data();
    document.getElementById('p-name').value     = d.name     || '';
    document.getElementById('p-username').value = d.username || '';
    document.getElementById('p-bio').value      = d.bio      || '';
    document.getElementById('p-location').value = d.location || '';
    document.getElementById('p-website').value  = d.website  || '';
    document.getElementById('p-timezone').value = d.timezone || '';
    document.getElementById('p-language').value = d.language || '';
    document.getElementById('p-notes').value    = d.notes    || '';
    // Update avatar with display name if set
    if (d.name) {
      document.getElementById('top-avatar').textContent = d.name.substring(0, 2).toUpperCase();
    }
  }
  dirty = false;
  setSaveStatus('All changes saved', false);
}

window.saveProfile = async () => {
  const user = auth.currentUser;
  if (!user) return;
  setLoading('save-btn', true, 'Saving…');
  const data = {
    name:     document.getElementById('p-name').value.trim(),
    username: document.getElementById('p-username').value.trim(),
    bio:      document.getElementById('p-bio').value.trim(),
    location: document.getElementById('p-location').value.trim(),
    website:  document.getElementById('p-website').value.trim(),
    timezone: document.getElementById('p-timezone').value.trim(),
    language: document.getElementById('p-language').value.trim(),
    notes:    document.getElementById('p-notes').value.trim(),
    updatedAt: new Date().toISOString()
  };
  try {
    await setDoc(doc(db, 'users', user.uid), data, { merge: true });
    dirty = false;
    setSaveStatus('Saved ✓', false);
    if (data.name) {
      document.getElementById('top-avatar').textContent = data.name.substring(0, 2).toUpperCase();
    }
    showMsg('msg-profile', 'Changes saved and synced.', 'success');
  } catch (e) {
    showMsg('msg-profile', 'Failed to save: ' + e.message);
  }
  setLoading('save-btn', false, 'Save changes');
};

window.markDirty = () => {
  dirty = true;
  setSaveStatus('Unsaved changes', true);
};

function setSaveStatus(text, unsaved) {
  const el = document.getElementById('save-status');
  el.textContent = text;
  el.className = 'save-status' + (unsaved ? '' : ' saved');
}

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use':  'That email is already registered.',
    'auth/invalid-email':         'Enter a valid email address.',
    'auth/weak-password':         'Password must be at least 6 characters.',
    'auth/user-not-found':        'No account with that email.',
    'auth/wrong-password':        'Incorrect password.',
    'auth/invalid-credential':    'Email or password is incorrect.',
    'auth/too-many-requests':     'Too many attempts. Try again later.',
  };
  return map[code] || 'Something went wrong. Try again.';
}

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const regVisible = document.getElementById('form-register').style.display !== 'none';
  if (regVisible) window.register();
  else window.login();
});
</script>
</body>
</html>
