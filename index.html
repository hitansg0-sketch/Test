<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wings App</title>
</head>

<body style="font-family:sans-serif; max-width:400px; margin:auto; padding:20px;">

  <!-- LOGIN / SIGNUP -->
  <div id="auth-section">

    <h2>Wings Login & Signup</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px;"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px;"
    >

    <button
      id="login-btn"
      style="width:48%; padding:10px;"
    >
      Log In
    </button>

    <button
      id="signup-btn"
      style="width:48%; padding:10px;"
    >
      Sign Up
    </button>

    <p id="auth-status"></p>

  </div>


  <!-- APP -->
  <div id="app-section" style="display:none;">

    <h2>
      Welcome, <span id="user-display"></span>
    </h2>

    <button
      id="logout-btn"
      style="padding:7px 12px; margin-bottom:15px;"
    >
      Log Out
    </button>

    <h3>Your Saved Note:</h3>

    <textarea
      id="note-box"
      placeholder="Write something..."
      style="width:100%; height:120px; box-sizing:border-box; padding:10px;"
    ></textarea>

    <br><br>

    <button
      id="save-btn"
      style="
        width:100%;
        padding:12px;
        background:#4CAF50;
        color:white;
        border:none;
        cursor:pointer;
      "
    >
      Save to Cloud
    </button>

    <p id="save-status"></p>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // ============================
    // SUPABASE CONFIG
    // ============================

    const SUPABASE_URL =
      "https://ckolqrstldnjnkfpypyf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_babfAUwiWenPUg9io3WuOw_fxMO_fmt";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ============================
    // ELEMENTS
    // ============================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const authSection =
      document.getElementById("auth-section");

    const appSection =
      document.getElementById("app-section");

    const userDisplay =
      document.getElementById("user-display");

    const noteBox =
      document.getElementById("note-box");

    const authStatus =
      document.getElementById("auth-status");

    const saveStatus =
      document.getElementById("save-status");

    const saveButton =
      document.getElementById("save-btn");


    // ============================
    // SIGN UP
    // ============================

    document
      .getElementById("signup-btn")
      .addEventListener("click", async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {
          authStatus.textContent =
            "Please enter an email and password.";
          return;
        }

        authStatus.textContent =
          "Creating account...";

        const { data, error } =
          await supabase.auth.signUp({
            email: email,
            password: password
          });

        if (error) {

          console.error(error);

          authStatus.textContent =
            "Signup error: " + error.message;

          return;
        }

        console.log("Signup successful:", data);

        authStatus.textContent =
          "✓ Account created!";

      });


    // ============================
    // LOGIN
    // ============================

    document
      .getElementById("login-btn")
      .addEventListener("click", async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {
          authStatus.textContent =
            "Please enter an email and password.";
          return;
        }

        authStatus.textContent =
          "Logging in...";

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          console.error(error);

          authStatus.textContent =
            "Login error: " + error.message;

          return;
        }

        console.log("Login successful:", data);

        authStatus.textContent =
          "✓ Logged in!";

      });


    // ============================
    // LOGOUT
    // ============================

    document
      .getElementById("logout-btn")
      .addEventListener("click", async () => {

        await supabase.auth.signOut();

      });


    // ============================
    // LOAD USER DATA
    // ============================

    async function loadUserData(user) {

      console.log(
        "Loading data for:",
        user.id
      );

      const { data, error } =
        await supabase
          .from("users")
          .select("saved_text")
          .eq("user_id", user.id)
          .maybeSingle();


      if (error) {

        console.error(
          "Load error:",
          error
        );

        saveStatus.textContent =
          "Cloud load error: " +
          error.message;

        return;
      }


      if (data) {

        noteBox.value =
          data.saved_text || "";

        console.log(
          "Cloud data loaded."
        );

      } else {

        console.log(
          "No saved data yet."
        );

      }

    }


    // ============================
    // SAVE TO CLOUD
    // ============================

    async function saveNote() {

      const {
        data: {
          user
        }
      } = await supabase.auth.getUser();


      if (!user) {

        saveStatus.textContent =
          "❌ You are not logged in.";

        return;
      }


      saveButton.disabled = true;

      saveButton.textContent =
        "Saving...";

      saveStatus.textContent =
        "☁️ Saving to cloud...";


      console.log(
        "Saving for user:",
        user.id
      );


      const { error } =
        await supabase
          .from("users")
          .upsert(
            {
              user_id: user.id,
              saved_text: noteBox.value,
              updated_at: new Date().toISOString()
            },
            {
              onConflict: "user_id"
            }
          );


      if (error) {

        console.error(
          "SAVE ERROR:",
          error
        );

        saveStatus.textContent =
          "❌ Save failed: " +
          error.message;

        saveButton.textContent =
          "Try Again";

        saveButton.disabled = false;

        return;
      }


      console.log(
        "SAVE SUCCESSFUL"
      );


      saveStatus.textContent =
        "✅ Saved to cloud!";

      saveButton.textContent =
        "Saved ✓";


      setTimeout(() => {

        saveButton.textContent =
          "Save to Cloud";

        saveButton.disabled =
          false;

      }, 2000);

    }


    document
      .getElementById("save-btn")
      .addEventListener(
        "click",
        saveNote
      );


    // ============================
    // AUTH STATE
    // ============================

    supabase.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth event:",
          event
        );


        if (session && session.user) {

          const user =
            session.user;


          authSection.style.display =
            "none";

          appSection.style.display =
            "block";


          userDisplay.textContent =
            user.email;


          await loadUserData(user);


        } else {

          authSection.style.display =
            "block";

          appSection.style.display =
            "none";

          userDisplay.textContent =
            "";

          noteBox.value =
            "";

        }

      }
    );


    // ============================
    // CHECK EXISTING SESSION
    // ============================

    const {
      data: {
        session
      }
    } = await supabase.auth.getSession();


    if (session && session.user) {

      authSection.style.display =
        "none";

      appSection.style.display =
        "block";

      userDisplay.textContent =
        session.user.email;

      await loadUserData(
        session.user
      );

    }

  </script>

</body>
</html>
