<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wings</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  max-width: 430px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1, h2, h3 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
}

.primary {
  width: 100%;
  background: #111;
  color: white;
}

.secondary {
  background: #eee;
  color: #111;
}

.danger {
  background: #e53935;
  color: white;
}

.row {
  display: flex;
  gap: 10px;
}

.row > * {
  flex: 1;
}

.status {
  font-size: 14px;
  margin-top: 10px;
}

.profile-picture-wrapper {
  text-align: center;
  margin-bottom: 20px;
}

.profile-picture {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
  display: block;
  margin: auto;
  border: 4px solid #eee;
}

.upload-label {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 14px;
  background: #eee;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

#profile-file {
  display: none;
}

.email {
  color: #777;
  font-size: 14px;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- AUTH -->
  <div id="auth-section">

    <div class="card">

      <h1>Wings</h1>

      <h2>Login</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <div class="row">

        <button
          id="login-btn"
          class="primary"
        >
          Log In
        </button>

        <button
          id="signup-btn"
          class="secondary"
        >
          Sign Up
        </button>

      </div>

      <p id="auth-status" class="status"></p>

    </div>

  </div>


  <!-- APP -->
  <div id="app-section" style="display:none;">

    <!-- PROFILE -->
    <div class="card">

      <h2>Your Profile</h2>

      <p id="user-email" class="email"></p>

      <div class="profile-picture-wrapper">

        <img
          id="profile-picture"
          class="profile-picture"
          src="https://placehold.co/120x120"
          alt="Profile Picture"
        >

        <label
          class="upload-label"
          for="profile-file"
        >
          Change Picture
        </label>

        <input
          id="profile-file"
          type="file"
          accept="image/*"
        >

        <p
          id="picture-status"
          class="status"
        ></p>

      </div>


      <input
        id="profile-name"
        type="text"
        placeholder="Profile Name"
      >

      <textarea
        id="bio"
        placeholder="Bio"
      ></textarea>


      <h3>Address</h3>

      <textarea
        id="address"
        placeholder="Full Address"
      ></textarea>

      <input
        id="phone"
        type="tel"
        placeholder="Phone Number"
      >

      <input
        id="city"
        type="text"
        placeholder="City"
      >

      <input
        id="state"
        type="text"
        placeholder="State"
      >

      <input
        id="pincode"
        type="text"
        placeholder="PIN Code"
      >


      <button
        id="save-profile-btn"
        class="primary"
      >
        Save Profile
      </button>

      <p
        id="profile-status"
        class="status"
      ></p>

    </div>


    <!-- CLOUD NOTE -->
    <div class="card">

      <h2>Cloud Note</h2>

      <textarea
        id="note-box"
        placeholder="Write something..."
      ></textarea>

      <button
        id="save-note-btn"
        class="primary"
      >
        Save to Cloud
      </button>

      <p
        id="note-status"
        class="status"
      ></p>

    </div>


    <!-- LOGOUT -->
    <div class="card">

      <button
        id="logout-btn"
        class="danger"
        style="width:100%;"
      >
        Log Out
      </button>

    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// =====================================
// SUPABASE
// =====================================

const SUPABASE_URL =
  "https://ckolqrstldnjnkfpypyf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_babfAUwiWenPUg9io3WuOw_fxMO_fmt";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================
// ELEMENTS
// =====================================

const authSection =
  document.getElementById("auth-section");

const appSection =
  document.getElementById("app-section");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const authStatus =
  document.getElementById("auth-status");

const userEmail =
  document.getElementById("user-email");

const profilePicture =
  document.getElementById("profile-picture");

const profileFile =
  document.getElementById("profile-file");

const pictureStatus =
  document.getElementById("picture-status");

const profileName =
  document.getElementById("profile-name");

const bio =
  document.getElementById("bio");

const address =
  document.getElementById("address");

const phone =
  document.getElementById("phone");

const city =
  document.getElementById("city");

const state =
  document.getElementById("state");

const pincode =
  document.getElementById("pincode");

const profileStatus =
  document.getElementById("profile-status");

const noteBox =
  document.getElementById("note-box");

const noteStatus =
  document.getElementById("note-status");


// =====================================
// SIGN UP
// =====================================

document
  .getElementById("signup-btn")
  .onclick = async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      authStatus.textContent =
        "Enter email and password.";

      return;
    }

    authStatus.textContent =
      "Creating account...";


    const {
      data,
      error
    } =
      await supabase.auth.signUp({
        email,
        password
      });


    if (error) {

      authStatus.textContent =
        "Signup error: " +
        error.message;

      return;
    }


    console.log(
      "SIGNUP RESULT:",
      data
    );


    authStatus.textContent =
      "✓ Account created!";
};


// =====================================
// LOGIN
// =====================================

document
  .getElementById("login-btn")
  .onclick = async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      authStatus.textContent =
        "Enter email and password.";

      return;
    }

    authStatus.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      authStatus.textContent =
        "Login error: " +
        error.message;

      return;
    }


    console.log(
      "LOGIN SUCCESS:",
      data
    );


    authStatus.textContent =
      "✓ Logged in!";
};


// =====================================
// LOGOUT
// =====================================

document
  .getElementById("logout-btn")
  .onclick = async () => {

    await supabase.auth.signOut();

};


// =====================================
// LOAD PROFILE
// =====================================

async function loadProfile(user) {

  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select("*")
      .eq("user_id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

    profileStatus.textContent =
      "Profile load error: " +
      error.message;

    return;
  }


  if (!data) {

    profilePicture.src =
      "https://placehold.co/120x120";

    return;
  }


  profileName.value =
    data.profile_name || "";

  bio.value =
    data.bio || "";

  address.value =
    data.address || "";

  phone.value =
    data.phone || "";

  city.value =
    data.city || "";

  state.value =
    data.state || "";

  pincode.value =
    data.pincode || "";


  if (data.profile_picture) {

    profilePicture.src =
      data.profile_picture;

  } else {

    profilePicture.src =
      "https://placehold.co/120x120";

  }

}


// =====================================
// SAVE PROFILE
// =====================================

document
  .getElementById("save-profile-btn")
  .onclick = async () => {

    const {
      data: {
        user
      }
    } =
      await supabase.auth.getUser();


    if (!user) {

      profileStatus.textContent =
        "❌ Not logged in.";

      return;
    }


    profileStatus.textContent =
      "Saving profile...";


    const {
      error
    } =
      await supabase
        .from("profiles")
        .upsert({

          user_id: user.id,

          profile_name:
            profileName.value.trim(),

          bio:
            bio.value.trim(),

          address:
            address.value.trim(),

          phone:
            phone.value.trim(),

          city:
            city.value.trim(),

          state:
            state.value.trim(),

          pincode:
            pincode.value.trim(),

          updated_at:
            new Date().toISOString()

        });


    if (error) {

      console.error(
        "PROFILE SAVE ERROR:",
        error
      );

      profileStatus.textContent =
        "❌ " +
        error.message;

      return;
    }


    profileStatus.textContent =
      "✅ Profile saved!";
};


// =====================================
// PROFILE PICTURE UPLOAD
// =====================================

profileFile
  .addEventListener(
    "change",
    async () => {

      const file =
        profileFile.files[0];

      if (!file) return;


      // -------------------------------
      // CHECK SESSION
      // -------------------------------

      pictureStatus.textContent =
        "Checking login session...";


      const {
        data: {
          session
        },
        error: sessionError
      } =
        await supabase.auth.getSession();


      console.log(
        "SESSION:",
        session
      );

      console.log(
        "SESSION ERROR:",
        sessionError
      );


      if (sessionError) {

        pictureStatus.textContent =
          "❌ Session error: " +
          sessionError.message;

        return;
      }


      if (!session || !session.user) {

        pictureStatus.textContent =
          "❌ No active login session.";

        return;
      }


      const user =
        session.user;


      console.log(
        "USER ID:",
        user.id
      );

      console.log(
        "USER EMAIL:",
        user.email
      );


      // -------------------------------
      // CHECK FILE
      // -------------------------------

      if (!file.type.startsWith("image/")) {

        pictureStatus.textContent =
          "❌ Please select an image.";

        return;
      }


      if (file.size > 5 * 1024 * 1024) {

        pictureStatus.textContent =
          "❌ Image must be under 5MB.";

        return;
      }


      pictureStatus.textContent =
        "Uploading picture...";


      // -------------------------------
      // FILE PATH
      // -------------------------------

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const filePath =
        user.id +
        "/profile." +
        extension;


      console.log(
        "UPLOAD PATH:",
        filePath
      );


      // -------------------------------
      // UPLOAD
      // -------------------------------

      const {
        data: uploadData,
        error: uploadError
      } =
        await supabase.storage
          .from("profile-pictures")
          .upload(
            filePath,
            file,
            {
              upsert: true,
              contentType: file.type
            }
          );


      console.log(
        "UPLOAD RESULT:",
        uploadData
      );

      console.log(
        "UPLOAD ERROR:",
        uploadError
      );


      if (uploadError) {

        pictureStatus.textContent =
          "❌ Upload failed: " +
          uploadError.message;

        return;
      }


      pictureStatus.textContent =
        "Picture uploaded. Saving URL...";


      // -------------------------------
      // PUBLIC URL
      // -------------------------------

      const {
        data: publicUrlData
      } =
        supabase.storage
          .from("profile-pictures")
          .getPublicUrl(
            filePath
          );


      const imageUrl =
        publicUrlData.publicUrl;


      console.log(
        "IMAGE URL:",
        imageUrl
      );


      profilePicture.src =
        imageUrl;


      // -------------------------------
      // SAVE URL TO PROFILE
      // -------------------------------

      const {
        error: profileError
      } =
        await supabase
          .from("profiles")
          .upsert({

            user_id:
              user.id,

            profile_picture:
              imageUrl,

            updated_at:
              new Date().toISOString()

          });


      if (profileError) {

        console.error(
          "PROFILE UPDATE ERROR:",
          profileError
        );

        pictureStatus.textContent =
          "⚠️ Picture uploaded, but profile URL couldn't be saved: " +
          profileError.message;

        return;
      }


      pictureStatus.textContent =
        "✅ Profile picture updated!";

    }
  );


// =====================================
// SAVE NOTE
// =====================================

document
  .getElementById("save-note-btn")
  .onclick = async () => {

    const {
      data: {
        user
      }
    } =
      await supabase.auth.getUser();


    if (!user) {

      noteStatus.textContent =
        "❌ Not logged in.";

      return;
    }


    noteStatus.textContent =
      "Saving...";


    const {
      error
    } =
      await supabase
        .from("users")
        .upsert({

          user_id:
            user.id,

          saved_text:
            noteBox.value,

          updated_at:
            new Date().toISOString()

        });


    if (error) {

      console.error(
        "NOTE SAVE ERROR:",
        error
      );

      noteStatus.textContent =
        "❌ " +
        error.message;

      return;
    }


    noteStatus.textContent =
      "✅ Saved to cloud!";
};


// =====================================
// LOAD NOTE
// =====================================

async function loadNote(user) {

  const {
    data,
    error
  } =
    await supabase
      .from("users")
      .select("saved_text")
      .eq("user_id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "NOTE LOAD ERROR:",
      error
    );

    return;
  }


  if (data) {

    noteBox.value =
      data.saved_text || "";

  }

}


// =====================================
// SHOW APP
// =====================================

async function showUserApp(user) {

  authSection.style.display =
    "none";

  appSection.style.display =
    "block";

  userEmail.textContent =
    user.email;

  await loadProfile(user);

  await loadNote(user);

}


// =====================================
// AUTH STATE
// =====================================

supabase.auth
  .onAuthStateChange(
    async (event, session) => {

      console.log(
        "AUTH EVENT:",
        event
      );


      if (session && session.user) {

        await showUserApp(
          session.user
        );

      } else {

        authSection.style.display =
          "block";

        appSection.style.display =
          "none";

        noteBox.value =
          "";

      }

    }
  );


// =====================================
// EXISTING SESSION
// =====================================

const {
  data: {
    session
  }
} =
  await supabase.auth.getSession();


if (session && session.user) {

  await showUserApp(
    session.user
  );

}

</script>

</body>
</html>
